name: Pages

# Builds the docs site and deploys it to https://pseudomuto.com/dev, along
# with install.sh at its root. dev is built from source, like in ci.yaml, so a
# dev.yaml that uses a key not yet released still loads.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - install.sh
      - demo/demo.gif
      - dev.yaml
      - .github/workflows/pages.yaml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build dev
        run: cargo build --locked

      - name: Put this build of dev on PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Install dependencies
        uses: ./
        with:
          version: installed

      - name: Build the site
        run: dev docs:build

      - name: Check the installer is in the site
        run: test -f site/book/install.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
