name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # This commit's dev sets up and runs everything, so a change to dev and a
      # dev.yaml that uses it land together. Debug builds never auto-update.
      - name: Build dev
        run: cargo build --locked

      - name: Put this build of dev on PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      # Rust toolchains (incl. nightly rustfmt), then actionlint, cargo-shear,
      # and shellcheck through mise.
      - name: Install dependencies
        run: dev up

      # The shell setup isn't loaded in CI, so use mise's shims for its tools.
      - name: Put dev's tools on PATH
        run: echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Run CI checks
        run: dev test:ci

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only builds it. Running it is `dev test:docker`, which is
      # interactive. The build copies sources by hand, so this catches a new
      # one it misses.
      - name: Build the test image
        run: docker build -t dev-test .
