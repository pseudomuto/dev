name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # This commit's dev sets up and runs everything, so a change to dev and a
      # dev.yaml that uses it land together. Debug builds never auto-update.
      - name: Build dev
        run: cargo build --locked

      - name: Put this build of dev on PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      # This repo's own action, with the dev just built: Rust toolchains (incl.
      # nightly rustfmt), then actionlint, cargo-shear, and shellcheck through
      # mise, cached.
      - name: Install dependencies
        id: dev
        uses: ./
        with:
          version: installed

      # Checks what the action promises: the tools are on PATH, mise's shims
      # come first (GitHub prepends $GITHUB_PATH lines in order), and dev
      # won't update itself.
      - name: Check the action's setup
        env:
          CACHE_HIT: ${{ steps.dev.outputs.cache-hit }}
          VERSION: ${{ steps.dev.outputs.version }}
        run: |
          set -eu
          echo "dev $VERSION, cache hit: $CACHE_HIT"
          command -v dev actionlint cargo-shear shellcheck
          case "$(command -v shellcheck)" in
            "$HOME"/.local/share/mise/shims/*) ;;
            *) echo "::error::shellcheck isn't from mise's shims: $(command -v shellcheck)"; exit 1 ;;
          esac
          test "$DEV_AUTO_UPDATE" = 0

      - name: Run CI checks
        run: dev test:ci

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only builds it. Running it is `dev test:docker`, which is
      # interactive. The build copies sources by hand, so this catches a new
      # one it misses.
      - name: Build the test image
        run: docker build -t dev-test .
