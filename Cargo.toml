[package]
name = "dev"
resolver = "3"
version = "0.0.2"
edition = "2024"
authors = ["David Muto <david.muto@gmail.com>"]
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "string"] }
cliclack = "0.5.7"
color-eyre = "0.6.5"
console = "0.16.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.1.1"
tempfile = "3.27.0"
textwrap = "0.16.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints.clippy]
mod_module_files = "warn"
