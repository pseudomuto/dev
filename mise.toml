[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[deps.cargo]
auto = true
sources = ["Cargo.toml"]
outputs = ["Cargo.lock"]
run = "cargo fetch"

[tools]
actionlint = "latest"
"cargo:cargo-shear" = "latest"
shellcheck = "latest"

[tasks.build]
description = "Build the project in debug mode"
run = "cargo build"

[tasks."build:release"]
description = "Build the project in release mode"
run = "cargo build --release"

[tasks.test]
description = "Run the tests"
raw = true
run = "cargo test --all-features"

[tasks."test:ci"]
description = "Run the full CI pipeline"
run = [
  { task = "fmt:check" },
  { task = "lint" },
  { task = "lint:deps" },
  { task = "lint:actions" },
  { task = "lint:shell" },
  { task = "test" },
  { task = "build" },
]

[tasks."test:docker"]
description = "Build a throwaway container with dev and a sample dev.yaml, and open a shell in it"
raw = true
run = ["docker build -t dev-test .", "docker run --rm -it dev-test"]

[tasks.demo]
description = "Record demo/demo.gif with VHS in a throwaway container (needs Docker and network)"
run = ["docker build -f demo/Dockerfile -t dev-demo .", "docker run --rm -v \"$PWD/demo:/vhs\" dev-demo"]

[tasks."test:verbose"]
description = "Run the tests without capturing output"
run = "cargo test --all-features -- --no-capture"

[tasks.fmt]
description = "Run cargo fmt"
run = "cargo +nightly fmt --all"

[tasks."fmt:check"]
description = "Check if cargo fmt would change anything"
run = "cargo +nightly fmt --all -- --check"

[tasks.lint]
description = "Run clippy"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks."lint:deps"]
description = "Check for unused dependencies"
run = "cargo shear"

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks."lint:shell"]
description = "Lint the shell scripts"
run = "shellcheck share/shell install.sh"

[tasks."lint:fix"]
description = "Run clippy and auto-fix where possible"
run = "cargo clippy --all-targets --all-features --fix --allow-dirty --allow-staged"
